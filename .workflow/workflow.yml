version: '1.0'
name: autoskill-daily
displayName: 日报邮件任务

triggers:
  - type: cron
    cron: '0 8 * * *'

stages:
  - stage: 每日 8 点发日报邮件
    tasks:
      - task: 全球新闻日报
        displayName: 全球新闻日报
        runner:
          image: ubuntu:22.04
        script:
          - python3 --version
          - python3 daily_global_news.py

      - task: 密炼机日报
        displayName: 密炼机日报
        runner:
          image: ubuntu:22.04
        script:
          - python3 --version
          - python3 daily_rubber_report.py
