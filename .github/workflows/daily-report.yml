name: 每日日报邮件

on:
  schedule:
    # UTC 0:00 = 北京时间 8:00
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 发送全球新闻日报
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: python daily_global_news.py

      - name: 发送密炼机日报
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: python daily_rubber_report.py
